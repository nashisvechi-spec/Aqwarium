<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#091e28"><title>Тихая вода — Аквариум 1.0</title>
<link rel="stylesheet" href="app.css"></head><body>
<canvas id="tank" aria-label="Аквариум. Нажмите на рыбку для просмотра её состояния. Меню открывается круглой кнопкой внизу."></canvas><button id="menuButton" aria-label="Открыть меню аквариума" title="Меню"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h14"/></svg></button>
<div class="loading-note" id="loading">Тихая вода<br><small style="font:12px system-ui">Загружаем ваш аквариум…</small></div>
<div class="control-bar" id="editor" role="region" aria-label="Расстановка оформления" hidden><div class="editor-heading"><b id="editName">Украшение</b><div class="editor-history"><button id="undo" aria-label="Отменить действие" title="Отменить действие"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 4-5 5 5 5M3 9h11a6 6 0 0 1 0 12h-2"/></svg></button><button id="redo" aria-label="Повторить действие" title="Повторить действие"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 4 5 5-5 5m5-5H10a6 6 0 0 0 0 12h2"/></svg></button></div></div><div class="editor-actions"><button id="editParams">Настроить</button><button id="editCancel">Отмена</button><button class="primary" id="editApply">Установить</button></div><p id="editHint">Перетащите предмет. Двумя пальцами можно изменить размер и повернуть.</p></div>
<div id="toast" role="status" aria-live="polite"></div><input id="fileInput" type="file" accept=".json,.zip,application/json,application/zip" hidden>
<dialog id="sheet"><div class="sheet-head"><button id="back" aria-label="Назад"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button><h2 id="sheetTitle">Ваш аквариум</h2><button id="closeSheet" aria-label="Закрыть"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="sheet-body" id="sheetBody"></div><div class="choice-footer" id="choiceFooter" hidden></div></dialog>
<dialog id="risk"><div class="sheet-head"><h2>Риск для соседей</h2></div><div class="sheet-body"><p id="riskText">В естественном режиме хищники могут съесть подходящих по размеру рыбок.</p><div class="row end"><button id="riskCancel">Отмена</button><button class="primary" id="riskApply">Продолжить</button></div></div></dialog>
